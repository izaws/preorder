<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>預購表單</title>
<style>
:root{--bg:#f2f2f2;--card:#fff;--tx:#1f1f21;--sub:#8c8c91;--chip:#e8e8ea;--ln:#e4e4e6;--ac:#2f2f33;--red:#cf490e;--gt:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--card:#242427;--tx:#f1f1f3;--sub:#9a9aa0;--chip:#303034;--ln:#38383c;--ac:#f1f1f3;--gt:#161618;--red:#ff8a5c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{max-width:560px;margin:0 auto;padding:20px 16px 60px}
.t{font-size:24px;font-weight:700;margin:4px 0 8px}
.tx{font-size:14px;color:var(--sub);white-space:pre-wrap;line-height:1.6}
.b{margin-top:16px}
.l{font-size:14px;color:var(--sub);margin:0 2px 6px}.l i{color:var(--red);font-style:normal;margin-left:2px}
.sec{font-size:18px;font-weight:700}.hd{font-size:20px;font-weight:700}
hr{border:0;border-top:1.5px dashed var(--ln);margin:6px 0}
input:not([type=checkbox]):not([type=radio]),textarea,select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--sub)}
textarea{resize:vertical;min-height:84px}
.o{display:flex;align-items:center;gap:10px;padding:8px 2px}.o input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:0;background:var(--chip);color:var(--sub);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px}
.chip.on{background:var(--ac);color:var(--gt)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border-radius:14px;padding:8px 8px 10px;text-align:center;outline:2px solid transparent}
.card.in{outline-color:var(--ac)}
.im{aspect-ratio:1;border-radius:10px;background:var(--chip) center/cover no-repeat;cursor:zoom-in}
.nm{font-size:13px;font-weight:600;margin-top:6px;word-break:break-all}.pr{font-size:13px;color:var(--sub)}
.q{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.q button{width:28px;height:28px;border-radius:50%;border:0;background:var(--ln);color:var(--tx);font-size:18px;line-height:1;padding:0}.q b{min-width:18px;text-align:center}
.sum{margin-top:14px}.sr{display:grid;grid-template-columns:1fr 44px 76px;gap:8px;padding:4px 0;font-size:14px}.sr.h{color:var(--sub);font-size:13px}
.sr span:nth-child(2){text-align:center}.sr span:last-child{text-align:right}
.row{display:flex;justify-content:space-between;align-items:center}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;background:var(--ac);color:var(--gt);margin-top:22px}
.btn:disabled{opacity:.4}
.box{background:var(--card);border-radius:16px;padding:16px 18px;margin-top:14px}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px;white-space:pre-wrap}
.bad{outline:2px solid var(--red);border-radius:12px}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.msg{text-align:center;padding:60px 10px;color:var(--sub)}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:var(--card);padding:10px;border-radius:10px;text-align:left}
#z{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;touch-action:pan-y;user-select:none}
#z.on{display:flex}#z img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
#z .x{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top,0px));color:#fff;font-size:32px;line-height:1}
#z .a{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:28px;line-height:1;padding:0}
#z .a.l{left:10px}#z .a.r{right:10px}
</style>
</head>
<body>
<div id="app"><div class="msg">載入中…</div></div>
<div id="z"></div>
<script>
/* ===== 基本設定 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=new URLSearchParams(location.search);
const T0=Date.now();
let API='';
try{const a=qs.get('a');if(a){const b=a.replace(/-/g,'+').replace(/_/g,'/');API=atob(b+'='.repeat((4-b.length%4)%4))}}catch(e){}
const TOKEN=qs.get('t')||qs.get('token')||qs.get('o')||'';

async function jget(params){const u=API+(API.includes('?')?'&':'?')+new URLSearchParams(params);const r=await fetch(u);return r.json()}
async function jpost(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return r.json()}
const money=n=>'$ '+Number(n||0).toLocaleString('en-US');
function fail(msg,raw){$('#app').innerHTML=`<div class="msg">${esc(msg)}${raw!==undefined?`<details style="margin-top:14px"><summary>技術資訊</summary><pre>${esc(JSON.stringify(raw,null,2).slice(0,1500))}</pre></details>`:''}</div>`}

/* ===== 狀態 ===== */
let CFG=null,PRODS=[],Q={},FW=[],FG='';
const stockOf=p=>{const v=p.stock!=null?p.stock:p.left!=null?p.left:(p.evs&&CFG&&CFG.ev!=null&&p.evs[CFG.ev]!=null?p.evs[CFG.ev]:null);return v==null?null:+v};
const imgsOf=p=>[p.img,...(p.imgs||[])].filter(Boolean);

/* ===== 載入 ===== */
async function init(){
  if(!API)return fail('連結不完整，請向店家取得正確的表單連結。');
  try{
    if(TOKEN)return payInit();
    const raw=await jget({action:'config'});
    if(raw&&raw.ok===false)return fail(raw.err||'表單載入失敗');
    const c=raw.config||raw.data||raw,pre=c.pre||c;
    if(!Array.isArray(pre.blocks))return fail('後台回應的格式和表單不符',raw);
    CFG={ev:pre.ev!=null?pre.ev:c.ev,title:pre.title||'',note:pre.note||'',blocks:pre.blocks,open:pre.open!==false&&c.open!==false};
    const all=c.products||pre.products||raw.products||[],pids=pre.pids||c.pids;
    PRODS=all.filter(p=>p&&!p.off&&(!pids||pids.includes(p.id)));
    document.title=CFG.title||'預購表單';
    if(!CFG.open)return fail('預購目前未開放');
    render();
  }catch(e){fail('連線失敗，請稍後再試（'+e.message+'）')}
}

/* ===== 表單 ===== */
function field(b){
  const t=b.type,al=`text-align:${b.align||'left'}`,L=`<div class="l">${esc(b.label||'')}${b.req?'<i>*</i>':''}</div>`,ph=esc(b.ph||''),n=esc(b.id);
  if(t=='section')return `<div class="sec" style="${al}">${esc(b.label||'')}</div>`;
  if(t=='heading')return `<div class="hd" style="${al}">${esc(b.label||'')}</div>${b.text?`<div class="tx" style="${al}">${esc(b.text)}</div>`:''}`;
  if(t=='note')return `<div class="tx" style="${al}">${esc(b.text||'')}</div>`;
  if(t=='divider')return '<hr>';
  if(t=='image')return b.url?`<div style="text-align:${b.align||'center'}"><img src="${esc(b.url)}" alt="" style="max-width:${b.size||100}%;border-radius:12px"></div>`:'';
  if(t=='products')return `<div id="prod"></div>`;
  if(t=='pickup')return `<div class="l">${esc(b.label||'')}<i>*</i></div>`+(b.opts||[]).map((o,i)=>`<label class="o"><input type="radio" name="pickup" value="${esc(o.id)}" ${i==0?'checked':''}>${esc(o.label)}</label>`).join('');
  if(t=='select')return `${L}<select name="${n}"><option value="">請選擇</option>${(b.opts||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  if(t=='radio'||t=='checkbox')return `${L}`+(b.opts||[]).map(o=>`<label class="o"><input type="${t}" name="${n}" value="${esc(o)}">${esc(o)}</label>`).join('');
  if(t=='agree')return `<label class="o"><input type="checkbox" name="${n}">${esc(b.label||'')}${b.req?'<i style="color:var(--red);font-style:normal">*</i>':''}</label>`;
  if(t=='textarea')return `${L}<textarea name="${n}" placeholder="${ph}"></textarea>`;
  const ty={email:'email',url:'url',tel:'tel',number:'number',date:'date',time:'time'}[t]||'text';
  return `${L}<input name="${n}" type="${ty}" placeholder="${ph}" ${t=='email'?'autocapitalize="off"':''}>`;
}
function render(){
  $('#app').innerHTML=`<div class="t">${esc(CFG.title||'預購表單')}</div>${CFG.note?`<div class="tx">${esc(CFG.note)}</div>`:''}
  <input class="hp" id="hp" tabindex="-1" autocomplete="off">
  <div id="fm">${CFG.blocks.map(b=>`<div class="b" data-b="${esc(b.id)}">${field(b)}</div>`).join('')}</div>
  <div class="err" id="er"></div><button class="btn" id="go" onclick="submit()">送出預購</button>`;
  drawProd();
}
function drawProd(){
  const el=$('#prod');if(!el)return;
  const pb=CFG.blocks.find(b=>b.type=='products')||{};
  const ws=[...new Set(PRODS.map(p=>p.work).filter(Boolean))],gs=[...new Set(PRODS.map(p=>p.group).filter(Boolean))];
  FW=FW.filter(w=>ws.includes(w));if(FG&&!gs.includes(FG))FG='';
  const ps=PRODS.filter(p=>(!FG||p.group==FG)&&(!FW.length||FW.includes(p.work)));
  const rows=PRODS.filter(p=>Q[p.id]).map(p=>({n:p.name,q:Q[p.id],s:Q[p.id]*p.price})),tot=rows.reduce((a,r)=>a+r.s,0);
  el.innerHTML=(ws.length||gs.length?`<div>${ws.length?`<div class="chips">${ws.map((w,i)=>`<button class="chip ${FW.includes(w)?'on':''}" onclick="tog('w',${i})">${esc(w)}</button>`).join('')}</div>`:''}${gs.length?`<div class="chips"><button class="chip ${FG?'':'on'}" onclick="tog('g',-1)">全部</button>${gs.map((g,i)=>`<button class="chip ${FG==g?'on':''}" onclick="tog('g',${i})">${esc(g)}</button>`).join('')}</div>`:''}</div>`:'')
  +`<div class="l">${esc(pb.label||'選擇商品')}<i>*</i></div>${pb.text?`<div class="tx" style="margin-bottom:8px">${esc(pb.text)}</div>`:''}`
  +(ps.length?`<div class="grid">${ps.map(p=>{const q=Q[p.id]||0,s=stockOf(p);return `<div class="card ${q?'in':''}"><div class="im" style="${p.img?`background-image:url('${esc(p.img)}')`:''}" onclick="zoom(${p.id})"></div><div class="nm">${esc(p.name)}</div><div class="pr">${money(p.price)}${s!=null&&s<=5?` · 剩 ${s}`:''}</div><div class="q"><button onclick="dq(${p.id},-1)">−</button><b>${q}</b><button onclick="dq(${p.id},1)" ${s!=null&&q>=s?'disabled':''}>+</button></div></div>`}).join('')}</div>`:'<div class="msg" style="padding:24px">沒有符合的商品</div>')
  +(rows.length?`<div class="sum"><div class="sr h"><span>品項</span><span>數量</span><span>金額</span></div>${rows.map(r=>`<div class="sr"><span>${esc(r.n)}</span><span>${r.q}</span><span>${money(r.s)}</span></div>`).join('')}<hr style="margin:10px 0"><div class="row"><b>總計</b><b style="font-size:18px">${money(tot)}</b></div></div>`:'');
}
function tog(k,i){const ws=[...new Set(PRODS.map(p=>p.work).filter(Boolean))],gs=[...new Set(PRODS.map(p=>p.group).filter(Boolean))];
  if(k=='g')FG=i<0||FG==gs[i]?'':gs[i];else{const w=ws[i],j=FW.indexOf(w);j>=0?FW.splice(j,1):FW.push(w)}drawProd()}
function dq(id,d){const p=PRODS.find(x=>x.id==id);if(!p)return;const s=stockOf(p);let q=Math.max(0,(Q[id]||0)+d);if(s!=null)q=Math.min(q,s);q=Math.min(q,50);if(q)Q[id]=q;else delete Q[id];drawProd()}

/* ===== 圖片放大（可左右拖曳） ===== */
let ZI=[],ZX=0,ZS=null,ZD=0,ZM=0;
function zoom(id){const p=PRODS.find(x=>x.id==id);ZI=p?imgsOf(p):[];if(!ZI.length)return;ZX=0;zdraw();$('#z').classList.add('on')}
function zdraw(){const z=$('#z');z.innerHTML=`<img src="${esc(ZI[ZX])}" alt="">${ZI.length>1?`<button class="a l" onclick="event.stopPropagation();zgo(-1)">‹</button><button class="a r" onclick="event.stopPropagation();zgo(1)">›</button>`:''}<span class="x">×</span>`}
function zgo(d){ZX=(ZX+d+ZI.length)%ZI.length;zdraw()}
(()=>{const z=$('#z');z.onclick=()=>{if(ZM){ZM=0;return}z.classList.remove('on')};
 z.onpointerdown=e=>{ZS=e.clientX;ZD=0;ZM=0;try{z.setPointerCapture(e.pointerId)}catch(_){}};
 z.onpointermove=e=>{if(ZS==null)return;ZD=e.clientX-ZS;if(Math.abs(ZD)>8)ZM=1;const m=z.querySelector('img');if(m&&ZM){m.style.transition='none';m.style.transform=`translateX(${ZD}px)`}};
 const end=()=>{if(ZS==null)return;const d=ZD;ZS=null;if(ZM&&ZI.length>1&&Math.abs(d)>50)zgo(d<0?1:-1);else{const m=z.querySelector('img');if(m){m.style.transition='transform .15s';m.style.transform=''}}setTimeout(()=>{ZM=0},60)};
 z.onpointerup=end;z.onpointercancel=end})();

/* ===== 送出 ===== */
function collect(){
  const ans={},o={};let bad=null;
  for(const b of CFG.blocks){
    const t=b.type,box=document.querySelector(`[data-b="${CSS.escape(String(b.id))}"]`);
    if(t=='products'){continue}
    if(t=='pickup'){const c=document.querySelector('input[name=pickup]:checked');o.mode=c&&c.value=='ship'?'ship':'onsite';continue}
    if(!PF_IN.includes(t))continue;
    let v;
    if(t=='checkbox'){v=[...box.querySelectorAll('input:checked')].map(x=>x.value)}
    else if(t=='radio'){const c=box.querySelector('input:checked');v=c?c.value:''}
    else if(t=='agree'){v=box.querySelector('input').checked?'已同意':''}
    else v=(box.querySelector('input,textarea,select').value||'').trim();
    const empty=Array.isArray(v)?!v.length:!v;
    if(b.req&&empty&&!bad)bad={box,msg:`請填寫「${b.label||'必填欄位'}」`};
    ans[b.id]=v;
    if(b.key=='nick')o.nick=v;else if(b.key=='social')o.link=v;else if(b.key=='email')o.email=v;else if(b.key=='memo')o.memo=v;
  }
  return {ans,o,bad};
}
const PF_IN=['text','textarea','email','url','tel','number','date','time','select','radio','checkbox','agree'];
async function submit(){
  const er=$('#er'),go=$('#go');er.textContent='';document.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));
  const items=Object.keys(Q).map(k=>({pid:+k,qty:Q[k]}));
  if(!items.length){er.textContent='請選擇商品';return}
  const {ans,o,bad}=collect();
  if(bad){bad.box.classList.add('bad');bad.box.scrollIntoView({behavior:'smooth',block:'center'});er.textContent=bad.msg;return}
  if(!o.mode)o.mode='onsite';
  go.disabled=true;go.textContent='送出中…';
  try{
    const r=await jpost({action:'submit',website:$('#hp').value,elapsed:Date.now()-T0,items,ans,...o});
    if(!r.ok)throw new Error(r.err||'送出失敗');
    done(r);
  }catch(e){er.textContent=e.message;go.disabled=false;go.textContent='送出預購'}
}
function done(r){
  const lines=(r.items||[]).map(i=>`<div class="sr" style="grid-template-columns:1fr 44px 76px"><span>${esc(i.name)}</span><span>${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('');
  $('#app').innerHTML=`<div class="t">預購完成</div><div class="tx">訂單編號 #${esc(r.no)}，確認信已寄到您的信箱${r.mailErr?'（寄信發生問題，請截圖此頁保存）':''}。若沒收到請檢查垃圾郵件匣。</div>
  <div class="box">${lines}<hr style="margin:10px 0"><div class="row"><b>合計</b><b style="font-size:18px">${money(r.total)}</b></div></div>
  ${r.mode=='onsite'&&r.bank?`<div class="box"><div class="l">匯款資訊</div><div style="white-space:pre-wrap">${esc(r.bank)}</div></div>`:''}
  ${r.payUrl?`<a class="btn" style="display:block;text-align:center;text-decoration:none" href="${esc(r.payUrl)}">前往回報匯款</a>`:''}`;
  scrollTo(0,0);
}

/* ===== 匯款回報頁（連結帶 t=訂單代碼） ===== */
async function payInit(){
  const r=await jget({action:'order',t:TOKEN});
  if(!r||r.ok===false)return fail((r&&r.err)||'找不到訂單');
  const o=r.order||r.data||r,items=o.items||[];
  document.title='匯款回報';
  $('#app').innerHTML=`<div class="t">匯款回報</div><div class="tx">訂單編號 #${esc(o.no||'')}${o.status?`　狀態：${esc(o.status)}`:''}</div>
  <div class="box">${items.map(i=>`<div class="sr" style="grid-template-columns:1fr 44px 76px"><span>${esc(i.name)}</span><span>${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}<hr style="margin:10px 0"><div class="row"><b>應付</b><b style="font-size:18px">${money(o.total)}</b></div></div>
  ${r.bank||o.bank?`<div class="box"><div class="l">匯款資訊</div><div style="white-space:pre-wrap">${esc(r.bank||o.bank)}</div></div>`:''}
  <div class="b"><div class="l">匯款帳號後五碼<i>*</i></div><input id="l5" inputmode="numeric" maxlength="5" placeholder="例如 12345"></div>
  <div class="err" id="er"></div><button class="btn" id="go" onclick="pay()">回報已匯款</button>`;
}
async function pay(){
  const v=($('#l5').value||'').trim(),er=$('#er');er.textContent='';
  if(!/^\d{5}$/.test(v)){er.textContent='請輸入 5 位數字';return}
  const g=$('#go');g.disabled=true;g.textContent='送出中…';
  try{const r=await jpost({action:'pay',token:TOKEN,t:TOKEN,last5:v});if(!r.ok)throw new Error(r.err||'回報失敗');
    $('#app').innerHTML='<div class="t">已收到回報</div><div class="tx">感謝您，店家確認款項後會再通知您。</div>'}
  catch(e){er.textContent=e.message;g.disabled=false;g.textContent='回報已匯款'}
}
init();
</script>
</body>
</html>
