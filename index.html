<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>預購表單</title>
<style>
:root{--bg:#f2f2f2;--card:#fff;--tx:#1f1f21;--sub:#8c8c91;--chip:#e8e8ea;--ln:#e4e4e6;--ac:#2f2f33;--red:#cf490e;--gt:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--card:#242427;--tx:#f1f1f3;--sub:#9a9aa0;--chip:#303034;--ln:#38383c;--ac:#f1f1f3;--gt:#161618;--red:#ff8a5c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{max-width:560px;margin:0 auto;padding:20px 16px 60px}
.t{font-size:24px;font-weight:700;margin:4px 0 8px}
.tx{font-size:14px;color:var(--sub);white-space:pre-wrap;line-height:1.6}
.b{margin-top:16px}
.l{font-size:14px;color:var(--sub);margin:0 2px 6px}.l i{color:var(--red);font-style:normal;margin-left:2px}
.sec{font-size:18px;font-weight:700}.hd{font-size:20px;font-weight:700}
hr{border:0;border-top:1.5px dashed var(--ln);margin:6px 0}
input:not([type=checkbox]):not([type=radio]),textarea,select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--sub)}
textarea{resize:vertical;min-height:84px}
.o{display:flex;align-items:center;gap:10px;padding:8px 2px}.o input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:0;background:var(--chip);color:var(--sub);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px}
.chip.on{background:var(--ac);color:var(--gt)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border-radius:14px;padding:8px 8px 10px;text-align:center;outline:2px solid transparent}
.card.in{outline-color:var(--ac)}
.im{aspect-ratio:1;border-radius:10px;background:var(--chip) center/cover no-repeat;cursor:zoom-in}
.nm{font-size:13px;font-weight:600;margin-top:6px;word-break:break-all}.pr{font-size:13px;color:var(--sub)}
.q{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.q button{width:28px;height:28px;border-radius:50%;border:0;background:var(--ln);color:var(--tx);font-size:18px;line-height:1;padding:0}.q b{min-width:18px;text-align:center}
.pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;color:#fff;margin-left:4px;background:#b3aca1;font-weight:500}.sr .pill{white-space:nowrap}.sr small{color:var(--sub);font-size:12px}.sum{margin-top:14px}.sr{display:grid;grid-template-columns:1fr 44px 76px;gap:8px;padding:4px 0;font-size:14px}.sr.h{color:var(--sub);font-size:13px}
.sr span:nth-child(2){text-align:center}.sr span:last-child{text-align:right}
.row{display:flex;justify-content:space-between;align-items:center}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;background:var(--ac);color:var(--gt);margin-top:22px}
.btn:disabled{opacity:.4}
.box{background:var(--card);border-radius:16px;padding:16px 18px;margin-top:14px}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px;white-space:pre-wrap}
.bad{outline:2px solid var(--red);border-radius:12px}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.msg{text-align:center;padding:60px 10px;color:var(--sub)}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:var(--card);padding:10px;border-radius:10px;text-align:left}
#z{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;touch-action:pan-y;user-select:none}
#z.on{display:flex}#z img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
#z .x{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top,0px));color:#fff;font-size:32px;line-height:1}
#z .a{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:28px;line-height:1;padding:0}
#z .a.l{left:10px}#z .a.r{right:10px}

.card{background:none;padding:0;border-radius:0;outline:0;text-align:left;touch-action:manipulation}
.grid{grid-template-columns:repeat(3,1fr);gap:12px 8px;padding:3px}
.card .im{aspect-ratio:6/7;border-radius:12px;background-color:var(--chip);background-size:cover;background-position:center}
.card.in .im{box-shadow:0 0 0 2.5px var(--ac)}
.card .nm{padding:5px 2px 0;font-size:14px;font-weight:600;line-height:1.25;word-break:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .pr{padding:0 2px;line-height:1.2;margin-top:1px}
.card .q{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.chips.w{margin-bottom:8px}.chips.w .chip.on{background:#8e8e93;color:#fff}
.chips.g .chip{background:none;font-weight:600;padding:8px 14px}.chips.g .chip.on{background:var(--ac);color:var(--gt)}

.imw{position:relative}.card .im{display:flex;align-items:center;justify-content:center}
.card{cursor:pointer}.card .q button:disabled{opacity:.4}
.card.so .im{filter:grayscale(1);opacity:.5}.card.so .nm,.card.so .pr{opacity:.5}
.pending-sale{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;background:rgba(47,47,51,.8);color:#fff;border-radius:5px;padding:9px 12px;font-size:13px;font-weight:600;pointer-events:none;box-shadow:0 1px 5px rgba(0,0,0,.12)}
.pending-sale svg{width:15px;height:15px;flex-shrink:0}
#pd{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px}#pd.on{display:flex}
#z{z-index:100}
.pvd-b{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:100%;overflow:auto;border-radius:24px;padding-bottom:18px}
.pvd-x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;line-height:1;padding:0;z-index:3}
.pvd-im{margin:18px 18px 0;height:min(40vh,340px);background:var(--chip);border-radius:16px;overflow:hidden;position:relative;touch-action:pan-y;cursor:zoom-in;user-select:none}
.pvd-im.ph{display:flex;align-items:center;justify-content:center;cursor:default}
.pvd-im.so .pvd-trk{filter:grayscale(1);opacity:.5}
.pvd-trk{display:flex;height:100%;transition:transform .32s cubic-bezier(.25,.8,.3,1)}
.pvd-s{flex:0 0 100%;height:100%;background:center/contain no-repeat}
.pvd-th{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 0}
.pvd-th i{flex:none;width:56px;height:56px;border-radius:10px;background:var(--chip) center/cover no-repeat;border:2px solid transparent;cursor:pointer}
.pvd-th i.on{border-color:var(--ac)}
.pvd-in{padding:16px 18px 0}
.pvd-r{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pvd-n{font-size:18px;min-width:0;word-break:break-all}
.pvd-q{display:flex;align-items:center;gap:10px;flex:none}
.pvd-q button{width:28px;height:28px;border-radius:50%;border:0;background:var(--ln);color:var(--tx);font-size:18px;line-height:1;padding:0}.pvd-q button:disabled{opacity:.4}
.pvd-q b{min-width:18px;text-align:center}
</style>
</head>
<body>
<div id="app"><div class="msg">載入中…</div></div>
<div id="z"></div>
<script>
/* ===== 基本設定 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=new URLSearchParams(location.search);
const T0=Date.now();
/* ★ 乾淨網址：把你的後台網址（Apps Script 部署後的 …/exec）貼在下面引號內，連結就不用再帶 ?a=… */
const DEFAULT_API='';
let API=DEFAULT_API;
try{const a=qs.get('a');if(a){const b=a.replace(/-/g,'+').replace(/_/g,'/');API=atob(b+'='.repeat((4-b.length%4)%4))}}catch(e){}
const TOKEN=qs.get('t')||qs.get('token')||qs.get('o')||'';

async function jget(params){const u=API+(API.includes('?')?'&':'?')+new URLSearchParams(params);const r=await fetch(u);return r.json()}
async function jpost(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return r.json()}
const money=n=>'$ '+Number(n||0).toLocaleString('en-US');
function fail(msg,raw){$('#app').innerHTML=`<div class="msg">${esc(msg)}${raw!==undefined?`<details style="margin-top:14px"><summary>技術資訊</summary><pre>${esc(JSON.stringify(raw,null,2).slice(0,1500))}</pre></details>`:''}</div>`}

/* ===== 狀態 ===== */
let CFG=null,PRODS=[],Q={},FW=[],FG='';
const stockOf=p=>{const v=p.stock!=null?p.stock:p.rem!=null?p.rem:p.left!=null?p.left:(p.evs&&CFG&&CFG.ev!=null&&p.evs[CFG.ev]!=null?p.evs[CFG.ev]:null);return v==null?null:+v};
const imgsOf=p=>[p.img,...(p.imgs||[])].filter(Boolean);
/* 品項：有設定品項(vars)就每個品項各自數量，否則商品本身就是唯一品項（和預覽表單相同） */
const itemsOf=p=>(p.vars&&p.vars.length)?p.vars.map((v,i)=>({k:p.id+'_'+i,vi:i,name:v.name,price:v.price===''||v.price==null?+p.price:+v.price})):[{k:p.id+'_0',vi:-1,name:p.name,price:+p.price}];
const qtyOf=p=>itemsOf(p).reduce((a,x)=>a+(Q[x.k]||0),0),sumOf=p=>itemsOf(p).reduce((a,x)=>a+(Q[x.k]||0)*x.price,0);

/* ===== 載入 ===== */
async function init(){
  if(!API)return fail('連結不完整，請向店家取得正確的表單連結。\n（店家：請在 preorder-index.html 填入 DEFAULT_API）');
  try{
    if(TOKEN)return payInit();
    const raw=await jget({action:'config'});
    if(raw&&raw.ok===false)return fail(raw.err||'表單載入失敗');
    const c=raw.config||raw.data||raw,pre=c.pre||c;
    if(!Array.isArray(pre.blocks))return fail('後台回應的格式和表單不符',raw);
    CFG={ev:pre.ev!=null?pre.ev:c.ev,title:pre.title||'',note:pre.note||'',blocks:pre.blocks,open:pre.open!==false&&c.open!==false,rules:c.rules||{full:[],buy:[]},pmeta:c.pmeta||{}};
    const all=c.products||pre.products||raw.products||[],pids=pre.pids||c.pids;
    PRODS=all.filter(p=>p&&!p.off&&(!pids||pids.includes(p.id)));
    document.title=CFG.title||'預購表單';
    if(!CFG.open)return fail('預購目前未開放');
    render();
  }catch(e){fail('連線失敗，請稍後再試（'+e.message+'）')}
}

/* ===== 表單 ===== */
function field(b){
  const t=b.type,al=`text-align:${b.align||'left'}`,L=`<div class="l">${esc(b.label||'')}${b.req?'<i>*</i>':''}</div>`,ph=esc(b.ph||''),n=esc(b.id);
  if(t=='section')return `<div class="sec" style="${al}">${esc(b.label||'')}</div>`;
  if(t=='heading')return `<div class="hd" style="${al}">${esc(b.label||'')}</div>${b.text?`<div class="tx" style="${al}">${esc(b.text)}</div>`:''}`;
  if(t=='note')return `<div class="tx" style="${al}">${esc(b.text||'')}</div>`;
  if(t=='divider')return '<hr>';
  if(t=='image')return b.url?`<div style="text-align:${b.align||'center'}"><img src="${esc(b.url)}" alt="" style="max-width:${b.size||100}%;border-radius:12px"></div>`:'';
  if(t=='products')return `<div id="prod"></div>`;
  if(t=='ordersum'&&ORD)return `<div class="sr h" style="grid-template-columns:1fr 44px 76px"><span>品項</span><span>數量</span><span>金額</span></div>${(ORD.items||[]).map(i=>`<div class="sr" style="grid-template-columns:1fr 44px 76px"><span>${esc(i.name)}</span><span>${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}<hr style="margin:10px 0"><div class="row"><b>應付</b><b style="font-size:18px">${money(ORD.total)}</b></div>`;
  if(t=='bankinfo')return ORD&&ORD.bank?`<div class="l">${esc(b.label||'匯款資訊')}</div><div style="white-space:pre-wrap">${esc(ORD.bank)}</div>`:'';
  if(t=='last5')return `${L}<input name="${n}" inputmode="numeric" maxlength="5" placeholder="${ph}" autocomplete="off">`;
  if(t=='pickup')return `<div class="l">${esc(b.label||'')}<i>*</i></div>`+(b.opts||[]).map((o,i)=>`<label class="o"><input type="radio" name="pickup" value="${esc(o.id)}" ${i==0?'checked':''}>${esc(o.label)}</label>`).join('');
  if(t=='select')return `${L}<select name="${n}"><option value="">請選擇</option>${(b.opts||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  if(t=='radio'||t=='checkbox')return `${L}`+(b.opts||[]).map(o=>`<label class="o"><input type="${t}" name="${n}" value="${esc(o)}">${esc(o)}</label>`).join('');
  if(t=='agree')return `<label class="o"><input type="checkbox" name="${n}">${esc(b.label||'')}${b.req?'<i style="color:var(--red);font-style:normal">*</i>':''}</label>`;
  if(t=='textarea')return `${L}<textarea name="${n}" placeholder="${ph}"></textarea>`;
  const ty={email:'email',url:'url',tel:'tel',number:'number',date:'date',time:'time'}[t]||'text';
  return `${L}<input name="${n}" type="${ty}" placeholder="${ph}" ${t=='email'?'autocapitalize="off"':''}>`;
}
function render(){
  $('#app').innerHTML=`<div class="t">${esc(CFG.title||'預購表單')}</div>${CFG.note?`<div class="tx">${esc(CFG.note)}</div>`:''}
  <input class="hp" id="hp" tabindex="-1" autocomplete="off">
  <div id="fm">${CFG.blocks.map(b=>`<div class="b" data-b="${esc(b.id)}">${field(b)}</div>`).join('')}</div>
  <div class="err" id="er"></div><button class="btn" id="go" onclick="submit()">送出預購</button>`;
  drawProd();
}
function drawProd(){
  const el=$('#prod');if(!el)return;
  const pb=CFG.blocks.find(b=>b.type=='products')||{};
  const ws=[...new Set(PRODS.map(p=>p.work).filter(Boolean))],gs=[...new Set(PRODS.map(p=>p.group).filter(Boolean))];
  FW=FW.filter(w=>ws.includes(w));if(FG&&!gs.includes(FG))FG='';
  const ps=PRODS.filter(p=>(!FG||p.group==FG)&&(!FW.length||FW.includes(p.work)));
  const rows=[];PRODS.forEach(p=>{const vr=p.vars&&p.vars.length;itemsOf(p).forEach(x=>{const q=Q[x.k]||0;if(q)rows.push({n:vr?p.name+'・'+x.name:p.name,q,s:q*x.price})})});const tot=rows.reduce((a,r)=>a+r.s,0);
  el.innerHTML=(ws.length||gs.length?`<div>${ws.length?`<div class="chips w">${ws.map((w,i)=>`<button class="chip ${FW.includes(w)?'on':''}" onclick="tog('w',${i})">${esc(w)}</button>`).join('')}</div>`:''}${gs.length?`<div class="chips g"><button class="chip ${FG?'':'on'}" onclick="tog('g',-1)">全部</button>${gs.map((g,i)=>`<button class="chip ${FG==g?'on':''}" onclick="tog('g',${i})">${esc(g)}</button>`).join('')}</div>`:''}</div>`:'')
  +`<div class="l">${esc(pb.label||'選擇商品')}<i>*</i></div>${pb.text?`<div class="tx" style="margin-bottom:8px">${esc(pb.text)}</div>`:''}`
  +(ps.length?`<div class="grid">${ps.map(p=>{const q=qtyOf(p),s=stockOf(p),so=s!=null&&s<=0;return `<div class="card ${q?'in':''} ${so?'so':''}" onclick="pvOpen(${p.id})"><div class="imw"><div class="im" style="${p.img?`background-image:url('${esc(p.img)}')`:''}">${p.img?'':GIFT}</div>${so?SOLD:''}</div><div class="nm">${esc(p.name)}</div><div class="pr">${money(p.price)}</div><div class="q" onclick="event.stopPropagation()"><button onclick="dc(${p.id},-1)">−</button><b>${q}</b><button onclick="dc(${p.id},1)" ${so||(s!=null&&q>=s)?'disabled':''}>+</button></div></div>`}).join('')}</div>`:'<div class="msg" style="padding:24px">沒有符合的商品</div>')
  +(rows.length?`<div class="sum"><div class="sr h"><span>品項</span><span>數量</span><span>金額</span></div>${rows.map(r=>`<div class="sr"><span>${esc(r.n)}</span><span>${r.q}</span><span>${money(r.s)}</span></div>`).join('')}${giftHtml(tot)}<hr style="margin:10px 0"><div class="row"><b>總計</b><b style="font-size:18px">${money(tot)}</b></div></div>`:'');
}
/* 消費禮／滿額禮（顯示方式和後台預覽相同；贈品只顯示，不影響訂單金額） */
const PM=id=>(CFG.pmeta||{})[id];
function giftHtml(tot){
  const R=CFG.rules||{},bought=PRODS.filter(p=>qtyOf(p)>0);if(!bought.length)return '';
  const used={};bought.forEach(p=>{const q=qtyOf(p);(p.combo&&p.combo.length?p.combo:[{pid:p.id,q:1}]).forEach(c=>{used[c.pid]=(used[c.pid]||0)+q*c.q})});
  const bP=r=>r.pids||(r.pid?[r.pid]:[]),bW=r=>r.works||[];
  const bl=r=>bP(r).map(id=>PM(id)).filter(Boolean).map(m=>m.n).concat(bW(r).map(w=>'作品：'+w)).join('、');
  const gName=r=>r.gid&&PM(r.gid)?PM(r.gid).n:(r.text||'（未選擇）');
  const rs=[];(R.full||[]).filter(r=>tot>=r.amt).forEach(r=>rs.push({txt:`滿 $${r.amt}`,r}));
  (R.buy||[]).forEach(r=>{const ps=bP(r),ws=bW(r);
    const ok=(!ps.length&&!ws.length)||bought.some(p=>[{id:p.id,w:p.work}].concat((p.combo||[]).map(c=>({id:c.pid,w:(PM(c.pid)||{}).w}))).some(x=>ps.includes(x.id)||(x.w&&ws.includes(x.w))));
    if(!ok)return;const l=bl(r);rs.push({txt:'消費禮'+(l?`（購買${l}）`:''),r})});
  const ic='<svg viewBox="0 0 24 24" width="15" height="15" style="vertical-align:-2px;flex:none" fill="currentColor"><path d="M3 9h18v3H3zM4 13h7v8H4zM13 13h7v8h-7zM12 9V21h0M11 9h2v12h-2z"/><path d="M12 9C9 9 6.5 8 6.5 6a2 2 0 0 1 3.500-1.300C11 5.800 12 9 12 9zM12 9c3 0 5.500-1 5.500-3a2 2 0 0 0-3.500-1.300C13 5.800 12 9 12 9z"/></svg>',left={};
  return rs.map(o=>{const r=o.r,pill=`<span class="pill">${esc(o.txt)}</span>`;
    if(!r.gid)return `<div class="sr"><span style="word-break:break-all">${ic} ${esc(gName(r))} ${pill}</span><span></span><span>-</span></div>`;
    const g=PM(r.gid);
    if(!g||!g.e||g.o)return `<div class="sr" style="opacity:.55"><span style="word-break:break-all">${ic} ${esc(g?g.n:gName(r))} ${pill}<br><small>本場次無法贈送</small></span><span>0</span><span>-</span></div>`;
    const comps=g.c&&g.c.length?g.c:[{pid:r.gid,q:1}];let cap=Infinity;
    comps.forEach(c=>{const x=PM(c.pid),v=x?x.s:null;if(v!=null)cap=Math.min(cap,Math.floor((v-(used[c.pid]||0)-(left[c.pid]||0))/c.q))});
    cap=Math.max(0,cap);const qty=Math.min(1,cap);comps.forEach(c=>{left[c.pid]=(left[c.pid]||0)+qty*c.q});
    return `<div class="sr" ${qty?'':'style="opacity:.55"'}><span style="word-break:break-all">${ic} ${esc(g.n)} ${pill}${qty?'':'<br><small>庫存不足</small>'}</span><span>${qty}</span><span>-</span></div>`}).join('');
}
function tog(k,i){const ws=[...new Set(PRODS.map(p=>p.work).filter(Boolean))],gs=[...new Set(PRODS.map(p=>p.group).filter(Boolean))];
  if(k=='g')FG=i<0||FG==gs[i]?'':gs[i];else{const w=ws[i],j=FW.indexOf(w);j>=0?FW.splice(j,1):FW.push(w)}drawProd()}
function setQ(p,k,d){const s=stockOf(p);let q=Math.max(0,(Q[k]||0)+d);if(d>0&&((s!=null&&qtyOf(p)>=s)||qtyOf(p)>=50))return;if(q)Q[k]=q;else delete Q[k]}
/* 商品卡上的 −／＋：有多個品項時＋會開啟詳情讓客人選品項 */
function dc(id,d){const p=PRODS.find(x=>x.id==id);if(!p)return;const it=itemsOf(p);if(d>0){if(it.length>1)return pvOpen(id);setQ(p,it[0].k,1)}else{const x=[...it].reverse().find(x=>Q[x.k]>0);if(x)setQ(p,x.k,-1)}drawProd();if(PDID==id)pdR()}
/* 詳情內各品項的 −／＋ */
function dq(id,k,d){const p=PRODS.find(x=>x.id==id);if(!p)return;setQ(p,k,d);drawProd();pdR()}


/* ===== 商品詳情（和預覽表單相同） ===== */
const GIFT='<svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#b8b2a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4"/><path d="M12 8v13M5 12v9h14v-9M8 8a2.5 2.5 0 110-5c2 0 4 2.5 4 5M16 8a2.5 2.5 0 100-5c-2 0-4 2.5-4 5"/></svg>';
const SOLD='<div class="pending-sale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg><span>完售</span></div>';
let PDID=null,PDI=0,PDMV=0;
function pvOpen(id){PDID=id;PDI=0;pdR()}
function pdR(){const p=PRODS.find(x=>x.id==PDID);if(!p)return;let d=$('#pd');if(!d){d=document.createElement('div');d.id='pd';d.onclick=e=>{if(e.target===d)pdClose()};document.body.appendChild(d)}
  const im=imgsOf(p),its=itemsOf(p),s=stockOf(p),q=qtyOf(p),so=s!=null&&s<=0;if(PDI>=im.length)PDI=0;
  d.innerHTML=`<div class="pvd-b"><button class="pvd-x" onclick="pdClose()">×</button><div class="pvd-im${im.length?'':' ph'}${so?' so':''}" id="pdim">${im.length?`<div class="pvd-trk" id="pdtrk" style="transform:translateX(-${PDI*100}%)">${im.map(u=>`<div class="pvd-s" style="background-image:url('${esc(u)}')"></div>`).join('')}</div>`:GIFT}${so?SOLD:''}</div>${im.length>1?`<div class="pvd-th" id="pdth">${im.map((u,i)=>`<i class="${i==PDI?'on':''}" style="background-image:url('${esc(u)}')" onclick="pdGo(${i})"></i>`).join('')}</div>`:''}
  <div class="pvd-in">${its.map((x,i)=>`<div class="pvd-r"><b class="pvd-n">${esc(x.name)}</b><b style="flex:none;font-size:18px">${money(x.price)}</b></div><div class="pvd-r" style="margin:6px 0 12px;align-items:center"><span class="tx" style="flex:1;min-width:0">${i==0?esc(p.desc||''):''}</span><span class="pvd-q"><button onclick="dq(${p.id},'${x.k}',-1)">−</button><b>${Q[x.k]||0}</b><button onclick="dq(${p.id},'${x.k}',1)" ${so||(s!=null&&q>=s)?'disabled':''}>+</button></span></div>`).join('')}
  <hr style="margin:4px 0 12px"><div class="row"><b>小計</b><b style="font-size:18px">${money(sumOf(p))}</b></div><button class="btn" style="margin-top:16px" onclick="pdClose()">完成</button></div></div>`;
  d.classList.add('on');pdSwipe()}
function pdGo(i){const p=PRODS.find(x=>x.id==PDID);if(!p)return;const n=imgsOf(p).length;if(!n)return;PDI=Math.max(0,Math.min(n-1,i));const k=$('#pdtrk');if(k){k.style.transition='';k.style.transform=`translateX(-${PDI*100}%)`}document.querySelectorAll('#pdth i').forEach((e,j)=>e.classList.toggle('on',j==PDI))}
function pdSwipe(){const el=$('#pdim'),k=$('#pdtrk');if(!el||!k)return;let x0=null,dx=0,w=1;el.onclick=()=>{if(!PDMV)zoom(PDID,PDI)};
  el.onpointerdown=e=>{x0=e.clientX;dx=0;PDMV=0;w=el.clientWidth||1;try{el.setPointerCapture(e.pointerId)}catch(_){}};
  el.onpointermove=e=>{if(x0==null)return;dx=e.clientX-x0;if(Math.abs(dx)>6)PDMV=1;if(PDMV){k.style.transition='none';k.style.transform=`translateX(calc(-${PDI*100}% + ${dx}px))`}};
  const end=()=>{if(x0==null)return;const d=dx;x0=null;k.style.transition='';pdGo(Math.abs(d)>w*.15?PDI+(d<0?1:-1):PDI);setTimeout(()=>PDMV=0,60)};
  el.onpointerup=end;el.onpointercancel=end}
function pdClose(){const d=$('#pd');if(d)d.classList.remove('on');PDID=null}

/* ===== 圖片放大（可左右拖曳） ===== */
let ZI=[],ZX=0,ZS=null,ZD=0,ZM=0;
function zoom(id,i){const p=PRODS.find(x=>x.id==id);ZI=p?imgsOf(p):[];if(!ZI.length)return;ZX=Math.min(+i||0,ZI.length-1);zdraw();$('#z').classList.add('on')}
function zdraw(){const z=$('#z');z.innerHTML=`<img src="${esc(ZI[ZX])}" alt="">${ZI.length>1?`<button class="a l" onclick="event.stopPropagation();zgo(-1)">‹</button><button class="a r" onclick="event.stopPropagation();zgo(1)">›</button>`:''}<span class="x">×</span>`}
function zgo(d){ZX=(ZX+d+ZI.length)%ZI.length;zdraw();if(PDID!=null)pdGo(ZX)}
(()=>{const z=$('#z');z.onclick=()=>{if(ZM){ZM=0;return}z.classList.remove('on')};
 z.onpointerdown=e=>{ZS=e.clientX;ZD=0;ZM=0;try{z.setPointerCapture(e.pointerId)}catch(_){}};
 z.onpointermove=e=>{if(ZS==null)return;ZD=e.clientX-ZS;if(Math.abs(ZD)>8)ZM=1;const m=z.querySelector('img');if(m&&ZM){m.style.transition='none';m.style.transform=`translateX(${ZD}px)`}};
 const end=()=>{if(ZS==null)return;const d=ZD;ZS=null;if(ZM&&ZI.length>1&&Math.abs(d)>50)zgo(d<0?1:-1);else{const m=z.querySelector('img');if(m){m.style.transition='transform .15s';m.style.transform=''}}setTimeout(()=>{ZM=0},60)};
 z.onpointerup=end;z.onpointercancel=end})();

/* ===== 送出 ===== */
function collect(blocks){
  const ans={},o={};let bad=null;
  for(const b of (blocks||CFG.blocks)){
    const t=b.type,box=document.querySelector(`[data-b="${CSS.escape(String(b.id))}"]`);
    if(t=='products'){continue}
    if(t=='pickup'){const c=document.querySelector('input[name=pickup]:checked');o.mode=c&&c.value=='ship'?'ship':'onsite';continue}
    if(t=='last5'){const v=(box.querySelector('input').value||'').trim();if(!/^\d{5}$/.test(v)&&!bad)bad={box,msg:`「${b.label||'匯款帳號後五碼'}」請輸入 5 位數字`};o.last5=v;continue}
    if(!PF_IN.includes(t))continue;
    let v;
    if(t=='checkbox'){v=[...box.querySelectorAll('input:checked')].map(x=>x.value)}
    else if(t=='radio'){const c=box.querySelector('input:checked');v=c?c.value:''}
    else if(t=='agree'){v=box.querySelector('input').checked?'已同意':''}
    else v=(box.querySelector('input,textarea,select').value||'').trim();
    if(v&&!Array.isArray(v)){
      if(t=='email'||b.key=='email'){const m=chkEmail(v);if(m&&!bad)bad={box,msg:m}}
      else if(t=='url'||b.key=='social'){const u=normUrl(v);if(u==null){if(!bad)bad={box,msg:`「${b.label||'網址'}」格式不正確，請貼上完整網址（例如 https://instagram.com/帳號）`}}else v=u}
    }
    const empty=Array.isArray(v)?!v.length:!v;
    if(b.req&&empty&&!bad)bad={box,msg:`請填寫「${b.label||'必填欄位'}」`};
    ans[b.id]=v;
    if(b.key=='nick')o.nick=v;else if(b.key=='social')o.link=v;else if(b.key=='email')o.email=v;else if(b.key=='memo')o.memo=v;
  }
  return {ans,o,bad};
}
const TYPO={'gmial.com':'gmail.com','gmai.com':'gmail.com','gamil.com':'gmail.com','gnail.com':'gmail.com','gmail.co':'gmail.com','gmail.con':'gmail.com','gmaill.com':'gmail.com','yaho.com.tw':'yahoo.com.tw','yahho.com.tw':'yahoo.com.tw','yahoo.con.tw':'yahoo.com.tw','hotmial.com':'hotmail.com','hotmal.com':'hotmail.com','outlok.com':'outlook.com','outlook.co':'outlook.com','icloud.co':'icloud.com','iclould.com':'icloud.com'};
function chkEmail(s){s=String(s).trim();if(!/^[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,}$/.test(s)||s.includes('..')||/^\.|\.@/.test(s))return 'Email 格式不正確，請確認有沒有打錯';const d=s.split('@')[1].toLowerCase();if(TYPO[d])return `Email 網域看起來打錯了，是不是 ${s.split('@')[0]}@${TYPO[d]}？`;return ''}
function normUrl(s){s=String(s||'').trim();if(!s)return '';if(/\s/.test(s))return null;const u=/^https?:\/\//i.test(s)?s:'https://'+s,m=u.match(/^https?:\/\/([^\/?#:]+)(?::\d+)?([\/?#].*)?$/i);if(!m||!/^([A-Za-z0-9\-]+\.)+[A-Za-z]{2,}$/.test(m[1]))return null;return u}
const PF_IN=['text','textarea','email','url','tel','number','date','time','select','radio','checkbox','agree'];
async function submit(){
  const er=$('#er'),go=$('#go');er.textContent='';document.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));
  const items=[];PRODS.forEach(p=>itemsOf(p).forEach(x=>{if(Q[x.k])items.push({pid:p.id,vi:x.vi,qty:Q[x.k]})}));
  if(!items.length){er.textContent='請選擇商品';return}
  const {ans,o,bad}=collect();
  if(bad){bad.box.classList.add('bad');bad.box.scrollIntoView({behavior:'smooth',block:'center'});er.textContent=bad.msg;return}
  if(!o.mode)o.mode='onsite';
  go.disabled=true;go.textContent='送出中…';
  try{
    const r=await jpost({action:'submit',base:location.origin+location.pathname,website:$('#hp').value,elapsed:Date.now()-T0,items,ans,...o});
    if(!r.ok)throw new Error(r.err||'送出失敗');
    done(r);
  }catch(e){er.textContent=e.message;go.disabled=false;go.textContent='送出預購'}
}
function done(r){
  const lines=(r.items||[]).map(i=>`<div class="sr" style="grid-template-columns:1fr 44px 76px"><span>${esc(i.name)}</span><span>${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('');
  $('#app').innerHTML=`<div class="t">預購完成</div><div class="tx">訂單編號 #${esc(r.no)}，確認信已寄到您的信箱${r.mailErr?'（寄信發生問題，請截圖此頁保存）':''}。若沒收到請檢查垃圾郵件匣。</div>
  <div class="box">${lines}<hr style="margin:10px 0"><div class="row"><b>合計</b><b style="font-size:18px">${money(r.total)}</b></div></div>
  ${r.mode=='onsite'&&r.bank?`<div class="box"><div class="l">匯款資訊</div><div style="white-space:pre-wrap">${esc(r.bank)}</div></div>`:''}
  ${r.payUrl?`<a class="btn" style="display:block;text-align:center;text-decoration:none" href="${esc(r.payUrl)}">前往回報匯款</a>`:''}`;
  scrollTo(0,0);
}

/* ===== 匯款回報頁（連結帶 t=訂單代碼） ===== */
let ORD=null;
async function payInit(){
  const r=await jget({action:'order',t:TOKEN});
  if(!r||r.ok===false)return fail((r&&r.err)||'找不到訂單');
  const o=r.order||r.data||r;ORD={no:o.no,status:o.status,mode:o.mode,items:o.items||[],total:o.total,bank:r.bank||o.bank||''};
  let bl=(r.blocks||o.blocks||[]).slice();
  if(!bl.length)bl=[{id:'p_sum',type:'ordersum',label:'訂單明細'},{id:'p_bank',type:'bankinfo',label:'匯款資訊'}];
  if(!bl.some(b=>b.type=='last5'))bl.push({id:'p_l5',type:'last5',label:'匯款帳號後五碼',ph:'例如 12345',req:1});
  PAYB=bl;
  const ttl=r.payTitle||o.payTitle||'匯款回報',note=r.payNote||o.payNote||'';
  document.title=ttl;
  const can=r.canPay!==false;
  const head=`<div class="t">${esc(ttl)}</div>${note?`<div class="tx" style="margin-bottom:4px">${esc(note)}</div>`:''}<div class="tx">訂單編號 #${esc(ORD.no||'')}${ORD.status?`　狀態：${esc(ORD.status)}`:''}</div>`;
  if(!can){
    const sum=bl.filter(b=>b.type=='ordersum');
    $('#app').innerHTML=head+sum.map(b=>`<div class="box">${field(b)}</div>`).join('')+`<div class="msg" style="padding:24px 0">${o.mode=='ship'?'通販訂單是貨到付款，不需要匯款回報。':'這筆訂單目前不需要匯款回報（可能已確認收款或已取消）。'}</div>`;
    return;
  }
  $('#app').innerHTML=head+`<div id="fm">${bl.map(b=>`<div class="b" data-b="${esc(b.id)}">${field(b)}</div>`).join('')}</div><div class="err" id="er"></div><button class="btn" id="go" onclick="pay()">回報已匯款</button>`;
}
let PAYB=[];
async function pay(){
  const er=$('#er');er.textContent='';
  const {ans,o,bad}=collect(PAYB);
  if(bad){er.textContent=bad.msg;try{bad.box.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}return}
  const g=$('#go');g.disabled=true;g.textContent='送出中…';
  try{const r=await jpost({action:'pay',base:location.origin+location.pathname,token:TOKEN,t:TOKEN,last5:o.last5,ans});if(!r.ok)throw new Error(r.err||'回報失敗');
    $('#app').innerHTML='<div class="t">已收到回報</div><div class="tx">感謝您，店家確認款項後會再通知您。</div>'}
  catch(e){er.textContent=e.message;g.disabled=false;g.textContent='回報已匯款'}
}
init();
</script>
